```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Verification</title>
    <link rel="stylesheet" href="/templates/email/styles.css">
    <style>
        /* Critical inline styles for email client compatibility */
        .email-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        .email-header {
            text-align: center;
            padding: 20px;
            background-color: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
        }
        .email-body {
            padding: 30px 20px;
            text-align: center;
        }
        .email-title {
            color: #212529;
            font-size: 24px;
            margin-bottom: 15px;
        }
        .email-text {
            color: #495057;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .email-badge {
            display: inline-block;
            padding: 8px 16px;
            background-color: #007bff;
            color: white;
            border-radius: 4px;
            font-size: 14px;
        }
        @media screen and (max-width: 480px) {
            .email-container {
                padding: 10px;
            }
            .email-title {
                font-size: 20px;
            }
            .email-text {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="email-container">
        <div class="email-header">
            <h2>Email Verification</h2>
        </div>
        <div class="email-body">
            <h1 class="email-title">Email Verified Successfully</h1>
            <p class="email-text">Hello {{username}},<br>Your email has been verified successfully. You can now login to your account.</p>
            <span class="email-badge">miniShop</span>
        </div>
    </div>
</body>
</html>
